[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pennytune"
version = "0.2.0"
description = "PennyTune is a free, no-API-key command-line forensic due-diligence tool for US-listed micro-caps: it surfaces risk signals and forensic flags from a company's SEC filings (accounting-quality and distress scores, dilution and corporate-action risk, insider activity, 8-K material events, delisting-notice and active trading-suspension risk, and fails-to-deliver settlement context), computed from the company's public SEC filings, for research only, not investment advice."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lavelle Hatcher Jr" }]
requires-python = ">=3.11"
keywords = [
    "python",
    "cli",
    "finance",
    "due-diligence",
    "investing",
    "fintech",
    "financial-analysis",
    "fundamental-analysis",
    "stock-analysis",
    "equities",
    "xbrl",
    "sec-edgar",
    "edgar",
    "micro-cap",
    "penny-stocks",
    "forensic-accounting",
    "dilution",
    "altman-z-score",
    "beneish",
    "piotroski",
    "delisting",
    "fails-to-deliver",
    "short-interest",
    "insider-trading",
    "form-4",
    "8-k",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Utilities",
]
dependencies = [
    # Range, not an exact pin: this is a published library, so an exact pin
    # makes the package unco-installable with anything wanting another pandas
    # and breaks any tool that re-resolves (pip-audit did). The 3.0.5 floor
    # keeps resolution off the yanked 3.0.4.
    "pandas>=3.0.5,<4",
    "numpy>=2.4.1",
    # 15.0.0 through 23.0.0 carry CVE-2026-25087, a use-after-free in the IPC
    # reader. Lowering this floor to widen compatibility reopens that range.
    "pyarrow>=23.0.1",
    "edgartools",
    "typer",
    "rich",
    "pyfiglet",
    # Capped: the config system is built on pydantic v2 APIs (ConfigDict,
    # field_validator, model_dump/model_validate/model_fields), which a v3
    # would be free to change.
    "pydantic>=2,<3",
    "platformdirs",
    "tomli-w",
    "pyrate-limiter",
    "tenacity",
    "defusedxml",
    "requests>=2.32.4",
]

[project.optional-dependencies]
schema = ["pydantic>=2,<3", "tomli-w"]
dev = ["pytest", "pytest-asyncio", "pytest-mock", "responses", "ruff", "mypy>=2.3,<3", "pip-audit", "build", "twine"]

[project.urls]
Homepage = "https://github.com/lavellehatcherjr/pennytune"
Repository = "https://github.com/lavellehatcherjr/pennytune"
Issues = "https://github.com/lavellehatcherjr/pennytune/issues"

[project.scripts]
pennytune = "pennytune.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pennytune"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
