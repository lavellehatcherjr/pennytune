# Dependabot opens PRs; it never auto-merges. Every PR runs the full CI matrix
# and pip-audit before anything lands.
version: 2
updates:
  # pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Dependabot treats a published pyproject.toml as a library and widens
    # ranges by default, walking the pyarrow floor back under CVE-2026-25087.
    versioning-strategy: "increase-if-necessary"

  # uv.lock. Separate ecosystem from "pip", which reads pyproject.toml only, so
  # without this the lock drifts and `uv sync` installs stale versions.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
